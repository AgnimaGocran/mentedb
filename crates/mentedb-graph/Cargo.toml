[package]
name = "mentedb-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Knowledge graph engine for MenteDB"
readme = "../../README.md"
keywords = ["database", "graph", "knowledge", "ai", "agent"]
categories = ["database-implementations", "data-structures"]

[dependencies]
mentedb-core = { workspace = true }
mentedb-storage = { path = "../mentedb-storage", version = "0.9.2", optional = true }
smallvec = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = []
sqlite = ["dep:sea-orm", "dep:tokio", "dep:mentedb-storage", "mentedb-storage/sqlite"]

[dev-dependencies]
uuid = { workspace = true }
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
